; Rising Ashes export presets (Android + iOS). See docs/RELEASE.md for signing,
; export templates and how to build. Signing fields are intentionally EMPTY:
; never commit keystores, passwords or Apple team IDs; set them in the editor's
; Export dialog (stored in .godot/export_credentials.cfg, which is git-ignored)
; or via the GODOT_ANDROID_KEYSTORE_RELEASE_* environment variables.
;
; exclude_filter drops everything the game doesn't load (docs/OPEN_SOURCE_AUDIT.md,
; "Imported but unused"). When game code starts loading one of these paths,
; remove its entry here or the release build will miss it.
;
; 2026-10-05 (docs/qa/ASSET_AUDIT.md, "2026-10-05 pass"): 225 entries appended to both presets = the visible (not .gdignore'd) models tagged
; "reject" or "reserve" in docs/qa/asset_audit_unreferenced.csv: meshy_free/maybe, the 11 meshy_free footbridges, legacy Quaternius characters,
; RTS and animal sources, both root-motion UAL files, superseded generated/ sets, the nine undecimated generated/scan photo scans.
; When one of them starts being loaded (the scans after LOCAL decimates them), remove its line from BOTH presets.

